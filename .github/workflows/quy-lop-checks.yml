name: Quy lop checks
on:
  pull_request:
    paths: ['quy-lop/**', '.github/workflows/quy-lop-checks.yml']
  push:
    branches: [quy-lop-transparency]
    paths: ['quy-lop/**', '.github/workflows/quy-lop-checks.yml']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: quy-lop/backend/package-lock.json
      - run: npm ci --prefix quy-lop/backend
      - run: npm test --prefix quy-lop/backend
      - run: node --test --test-isolation=none quy-lop/public-tests/*.test.js
      - run: npm ci --prefix quy-lop/online
      - run: npm test --prefix quy-lop/online
      - run: npm run build --prefix quy-lop/online
